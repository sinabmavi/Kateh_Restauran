# Function-level settings used by `supabase functions deploy`.
# JWT verification is handled inside the functions: guests may reserve without an account, and the browser sends
# a publishable key (not a JWT) when nobody is signed in, so the gateway check must be off.

[functions.create-checkout]
verify_jwt = false

[functions.capture-checkout]
verify_jwt = false

[functions.manage-admins]
verify_jwt = false

# Called by the reservations database trigger, which sends no user token. The function trusts only the reservation id.
[functions.reservation-email]
verify_jwt = false

# Called every minute by pg_cron and by the dashboard. Admin actions check the user's token inside.
[functions.marketing-email]
verify_jwt = false